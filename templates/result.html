<!DOCTYPE html>
<html lang="en">
<head>

    <title>Prediction Result</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .result-container {
            max-width: 400px;

            border-radius: 8px;

            color: #333;
        }

    <div class="result-container">
        <h1>Prediction Result</h1>
        <p>Predicted Price: {{ predicted_price }}</p>

</html>
