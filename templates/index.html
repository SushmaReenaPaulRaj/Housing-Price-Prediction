<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            text-align: center;
        }

        form {
            max-width: 400px;
            margin: 0 auto;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>House Price Prediction</h1>
    <form action="/predict" method="post">
        <label for="area">Area:</label>
        <input type="number" id="area" name="area" required><br>

        <label for="bedrooms">Bedrooms:</label>
        <input type="number" id="bedrooms" name="bedrooms" required><br>

        <label for="bathrooms">Bathrooms:</label>
        <input type="number" id="bathrooms" name="bathrooms" required><br>

        <label for="stories">Stories:</label>
        <input type="number" id="stories" name="stories" required><br>

        <label for="mainroad">Main Road:</label>
        <select id="mainroad" name="mainroad" required>
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select><br>

        <label for="guestroom">Guest Room:</label>
        <select id="guestroom" name="guestroom" required>
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select><br>

        <label for="airconditioning">Air Conditioning:</label>
        <select id="airconditioning" name="airconditioning" required>
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select><br>

        <label for="parking">Parking:</label>
        <input type="number" id="parking" name="parking" required><br>

        <label for="prefarea">Preferred Area:</label>
        <select id="prefarea" name="prefarea" required>
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select><br>

        <label for="furnishingstatus">Furnishing Status:</label>
        <select name="furnishingstatus" required>
            <option value="0">Furnished</option>
            <option value="1">Semi-Furnished</option>
            <option value="2">Unfurnished</option>
        </select>

        <input type="submit" value="Predict">
    </form>
</body>
</html>
